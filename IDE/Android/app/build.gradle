apply plugin: 'com.android.application'

android {
    //noinspection GradleDependency
    compileSdk 23
    buildToolsVersion '30.0.3'
    // Per RiDP, 29+ is not recommended because G3 devices do not support API 29 fully.
    //noinspection GradleDependency
    compileSdkVersion 28
    defaultConfig {
        applicationId "com.example.wolfssl"
        // Support G2 devices.
        minSdkVersion 17
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 23
        versionCode 100000
        versionName "1.0.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments notClass: 'com.wolfssl.wolfcrypt.test.WolfCryptTestSuite,com.wolfssl.provider.jce.test.WolfJCETestSuite,com.wolfssl.wolfcrypt.test.fips.WolfCryptFipsTestSuite'
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
    sourceSets {
        main.java.srcDirs += '../../../src/main/java'
    }
    lintOptions {
        // This is for development only. For such a serious library we need to address all linter
        // problems. But we need to allow build targets to complete so we can see the problems.
        abortOnError false

        // G2/4.2.2 devices have weak PRNG impls, but it isn't clear to me if our
        // customizations or WolfCrypt obviates this. At any rate, G2 is lucky to even be
        // supported, so ignore this regardless.
//        disable 'TrulyRandom'
    }
    namespace 'com.example.wolfssl'
}

// The SOP package generation stuff. HERE BE DRAGONS.
// Later Gradle moved the artefacts.
android.applicationVariants.all { variant ->
    variant.outputs.all {
        logger.info("DOING ${outputFileName}")
        outputFileName = "../" + outputFileName
        logger.info("DONE ${outputFileName}")
    }
}

apply from: "${ricohGradleDir}/ricoh.gradle"

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    testImplementation 'junit:junit:4.13.2'

//    androidTestImplementation 'junit:junit:4.13.2'
//    androidTestImplementation 'com.android.support.test:runner:1.0.2'
//    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
}
